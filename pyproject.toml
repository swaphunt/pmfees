[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pmfees"
version = "0.1.1"
description = "Exact trading fees for Kalshi, Polymarket US and polymarket.com, with a CLI and break-even helper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SwapHunt", email = "github@swaphunt.dev" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["kalshi", "polymarket", "prediction markets", "fees", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/swaphunt/pmfees"
Source = "https://github.com/swaphunt/pmfees"
Issues = "https://github.com/swaphunt/pmfees/issues"
Changelog = "https://github.com/swaphunt/pmfees/blob/main/CHANGELOG.md"
"Fee calculator" = "https://swaphunt.dev/tools/kalshi-vs-polymarket-fee-calculator"

[project.scripts]
pmfees = "pmfees.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmfees = ["py.typed", "data/prediction_market_fees.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Θ, × and − are intentional in formulas and docs

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]
