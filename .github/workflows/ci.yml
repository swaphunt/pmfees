# Tests, ruff and mypy on every push and pull request. Publishes nothing (see release.yml).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest==9.2.0 ruff==0.17.4 mypy==2.4.1
      - run: pytest -q
      - run: ruff check . && ruff format --check .
      - run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/pmfees-*.whl
          cd /tmp && /tmp/clean/bin/pmfees kalshi --price 0.50 --contracts 1 | grep -F 'Kalshi taker fee: $0.0175'
