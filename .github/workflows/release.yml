# Publishes pmfees to PyPI when a tag like v0.1.0 is pushed, with PyPI Trusted Publishing (OIDC):
# no PyPI token is stored anywhere. The `pypi` environment has a required reviewer, so the
# publish job waits for approval in GitHub before anything is uploaded.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi            # must match the trusted publisher configured on PyPI
    permissions:
      id-token: write            # lets PyPI verify this workflow; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Tag must match package version and CHANGELOG
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pmfees/__init__.py)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          grep -q "^## ${version} " CHANGELOG.md || { echo "CHANGELOG.md has no entry for ${version}"; exit 1; }
      - name: Tests
        run: uv run --with pytest==9.2.0 pytest -q
      - run: uv build
      - name: Smoke test the wheel
        run: cd /tmp && uv tool run --isolated --from "$GITHUB_WORKSPACE"/dist/pmfees-*.whl pmfees kalshi --price 0.50 --contracts 1
      - run: uv publish --trusted-publishing always
